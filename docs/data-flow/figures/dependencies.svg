<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>Three-loop matter channels: the lower-order dependencies</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#527267"/></marker></defs><rect width="100%" height="100%" fill="#f4f6ef"/>
<text x="40" y="48" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#173e33">Three-loop matter channels: the lower-order dependencies</text>
<rect x="40" y="95" width="340" height="150" rx="12" fill="#ffffff" stroke="#b6cabc" stroke-width="2"/>
<text x="58" y="126" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#173e33">Af = CF CA T</text>
<text x="58" y="156" font-family="Arial,sans-serif" font-size="16" fill="#31564a">31 orbit contributions</text>
<text x="58" y="181" font-family="Arial,sans-serif" font-size="16" fill="#31564a">CT needs v₁, v₂,A and v₂,f</text>
<rect x="430" y="95" width="340" height="150" rx="12" fill="#ffffff" stroke="#b6cabc" stroke-width="2"/>
<text x="448" y="126" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#173e33">Ff = CF² T</text>
<text x="448" y="156" font-family="Arial,sans-serif" font-size="16" fill="#31564a">2 Pi2 contributions</text>
<text x="448" y="181" font-family="Arial,sans-serif" font-size="16" fill="#31564a">CT needs v₁ only</text>
<rect x="820" y="95" width="340" height="150" rx="12" fill="#ffffff" stroke="#b6cabc" stroke-width="2"/>
<text x="838" y="126" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#173e33">ff = CF T²</text>
<text x="838" y="156" font-family="Arial,sans-serif" font-size="16" fill="#31564a">2 double-bubble contributions</text>
<text x="838" y="181" font-family="Arial,sans-serif" font-size="16" fill="#31564a">CT needs v₁ and v₂,f</text>
<rect x="40" y="315" width="340" height="135" rx="12" fill="#e7f0df" stroke="#b6cabc" stroke-width="2"/>
<text x="58" y="346" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#173e33">ŵ₃,Af + CT₃,Af</text>
<text x="58" y="376" font-family="Arial,sans-serif" font-size="16" fill="#31564a">Retain the original S₁, S₂, S₃</text>
<text x="58" y="401" font-family="Arial,sans-serif" font-size="16" fill="#31564a">Use the full beta color algebra</text>
<rect x="430" y="315" width="340" height="135" rx="12" fill="#e7f0df" stroke="#b6cabc" stroke-width="2"/>
<text x="448" y="346" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#173e33">ŵ₃,Ff + CT₃,Ff</text>
<text x="448" y="376" font-family="Arial,sans-serif" font-size="16" fill="#31564a">Retain the original S₁ and S₃</text>
<text x="448" y="401" font-family="Arial,sans-serif" font-size="16" fill="#31564a">Use the full beta color algebra</text>
<rect x="820" y="315" width="340" height="135" rx="12" fill="#e7f0df" stroke="#b6cabc" stroke-width="2"/>
<text x="838" y="346" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#173e33">ŵ₃,ff + CT₃,ff</text>
<text x="838" y="376" font-family="Arial,sans-serif" font-size="16" fill="#31564a">Retain the original S₁, S₂, S₃</text>
<text x="838" y="401" font-family="Arial,sans-serif" font-size="16" fill="#31564a">Use the full beta color algebra</text>
<polyline points="210,245 210,315" fill="none" stroke="#527267" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline points="600,245 600,315" fill="none" stroke="#527267" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline points="990,245 990,315" fill="none" stroke="#527267" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="220" y="530" width="760" height="130" rx="12" fill="#ffffff" stroke="#b6cabc" stroke-width="2"/>
<text x="238" y="561" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#173e33">Each channel → log Z₄ poles + finite F₃,c</text>
<text x="238" y="591" font-family="Arial,sans-serif" font-size="16" fill="#31564a">Cusp/pole/RG checks pass; independent finite validation has separate scope</text>
<text x="238" y="616" font-family="Arial,sans-serif" font-size="16" fill="#31564a">T = TF nf. Missing three-loop AA diagrams are not inputs to these channels.</text>
<polyline points="210,450 210,495 600,495 600,530" fill="none" stroke="#527267" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline points="600,450 600,495 600,495 600,530" fill="none" stroke="#527267" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline points="990,450 990,495 600,495 600,530" fill="none" stroke="#527267" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>