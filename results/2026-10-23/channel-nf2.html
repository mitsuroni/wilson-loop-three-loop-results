ndent shape $f_{3,ff}(\\rho)=F_{3,ff}(0,\\rho)$ is:\n\n\\[\n\\begin{aligned}& - \\frac{5 M_{1,1}}{27} - \\frac{M_{2,1}}{36} + \\frac{\\rho^{4}}{864} + \\frac{\\pi^{2} \\rho^{2}}{216} + \\frac{25 \\rho^{2}}{324} - \\frac{110 \\zeta\\left(3\\right)}{243}\\\\ & {} - \\frac{7 \\pi^{4}}{19440} + \\frac{32}{6561} + \\frac{38 \\pi^{2}}{243}\\end{aligned}\n\\]\n\nThe cusp coefficient $k_{3,ff}$ and non-cusp coefficient $h_{3,ff}$ are, respectively:\n\n\\[\n- \\frac{1}{27}\n\\]\n\n\\[\n- \\frac{260}{729} - \\frac{5 \\pi^{2}}{162} + \\frac{14 \\zeta\\left(3\\right)}{27}\n\\]\n\nThe contour anomalous dimension convention is $\\gamma_{4,3,c}=2h_{3,c}$.\n\n## Scale-stripped bare color sum U\n\n### Coefficient of $\\epsilon^{-6}$\n\n\\[\n0\n\\]\n### Coefficient of $\\epsilon^{-5}$\n\n\\[\n0\n\\]\n### Coefficient of $\\epsilon^{-4}$\n\n\\[\n- \\frac{1}{81}\n\\]\n### Coefficient of $\\epsilon^{-3}$\n\n\\[\n- \\frac{10}{243}\n\\]\n### Coefficient of $\\epsilon^{-2}$\n\n\\[\n- \\frac{M_{0,1}}{18} - \\frac{1}{9} - \\frac{\\pi^{2}}{324}\n\\]\n### Coefficient of $\\epsilon^{-1}$\n\n\\[\n- \\frac{5 M_{0,1}}{27} - \\frac{M_{1,1}}{12} - \\frac{608}{2187} - \\frac{7 \\zeta\\left(3\\right)}{81} - \\frac{5 \\pi^{2}}{486}\n\\]\n### Coefficient of $\\epsilon^{0}$\n\n\\[\n\\begin{aligned}& \\frac{M_{0,1}^{2}}{48} + \\frac{M_{0,1} \\rho^{2}}{16} - \\frac{M_{0,1}}{2} - \\frac{\\pi^{2} M_{0,1}}{72} - \\frac{5 M_{1,1}}{18} - \\frac{M_{2,1}}{16} - \\frac{4376}{6561}\\\\ & {} - \\frac{70 \\zeta\\left(3\\right)}{243} - \\frac{\\pi^{2}}{36} - \\frac{67 \\pi^{4}}{38880}\\end{aligned}\n\\]\n## Scale-restored bare exponent S3 U\n\n### Coefficient of $\\epsilon^{-6}$\n\n\\[\n0\n\\]\n### Coefficient of $\\epsilon^{-5}$\n\n\\[\n0\n\\]\n### Coefficient of $\\epsilon^{-4}$\n\n\\[\n- \\frac{2}{81}\n\\]\n### Coefficient of $\\epsilon^{-3}$\n\n\\[\n- \\frac{2 L}{27} - \\frac{20}{243}\n\\]\n### Coefficient of $\\epsilon^{-2}$\n\n\\[\n- \\frac{L^{2}}{9} - \\frac{20 L}{81} - \\frac{M_{0,1}}{9} - \\frac{\\rho^{2}}{36} - \\frac{2}{9} - \\frac{\\pi^{2}}{162}\n\\]\n### Coefficient of $\\epsilon^{-1}$\n\n\\[\n\\begin{aligned}& - \\frac{L^{3}}{9} - \\frac{10 L^{2}}{27} - \\frac{L M_{0,1}}{3} - \\frac{L \\rho^{2}}{12} - \\frac{2 L}{3} - \\frac{\\pi^{2} L}{54} - \\frac{10 M_{0,1}}{27} - \\frac{M_{1,1}}{6}\\\\ & {} - \\frac{5 \\rho^{2}}{54} - \\frac{1216}{2187} - \\frac{14 \\zeta\\left(3\\right)}{81} - \\frac{5 \\pi^{2}}{243}\\end{aligned}\n\\]\n### Coefficient of $\\epsilon^{0}$\n\n\\[\n\\begin{aligned}& - \\frac{L^{4}}{12} - \\frac{10 L^{3}}{27} - \\frac{L^{2} M_{0,1}}{2} - \\frac{L^{2} \\rho^{2}}{8} - L^{2} - \\frac{\\pi^{2} L^{2}}{36} - \\frac{10 L M_{0,1}}{9}\\\\ & {} - \\frac{L M_{1,1}}{2} - \\frac{5 L \\rho^{2}}{18} - \\frac{1216 L}{729} - \\frac{14 L \\zeta\\left(3\\right)}{27} - \\frac{5 \\pi^{2} L}{81} + \\frac{M_{0,1}^{2}}{24} - M_{0,1}\\\\ & {} - \\frac{\\pi^{2} M_{0,1}}{36} - \\frac{5 M_{1,1}}{9} - \\frac{M_{2,1}}{8} - \\frac{\\rho^{4}}{192} - \\frac{\\rho^{2}}{4} - \\frac{\\pi^{2} \\rho^{2}}{144} - \\frac{8752}{6561}\\\\ & {} - \\frac{140 \\zeta\\left(3\\right)}{243} - \\frac{\\pi^{2}}{18} - \\frac{67 \\pi^{4}}{19440}\\end{aligned}\n\\]\n## Coupling counterterm CT\n\n### Coefficient of $\\epsilon^{-6}$\n\n\\[\n0\n\\]\n### Coefficient of $\\epsilon^{-5}$\n\n\\[\n0\n\\]\n### Coefficient of $\\epsilon^{-4}$\n\n\\[\n- \\frac{1}{9}\n\\]\n### Coefficient of $\\epsilon^{-3}$\n\n\\[\n\\frac{5}{27}\n\\]\n### Coefficient of $\\epsilon^{-2}$\n\n\\[\n\\frac{L^{2}}{9} + \\frac{10 L}{27} - \\frac{M_{0,1}}{9} - \\frac{\\rho^{2}}{12} - \\frac{\\pi^{2}}{9} + \\frac{28}{81}\n\\]\n### Coefficient of $\\epsilon^{-1}$\n\n\\[\n\\begin{aligned}& \\frac{L^{3}}{9} + \\frac{10 L^{2}}{27} - \\frac{L M_{0,1}}{9} - \\frac{5 L \\rho^{2}}{36} - \\frac{11 \\pi^{2} L}{54} + \\frac{56 L}{81} + \\frac{M_{1,1}}{6}\\\\ & {} - \\frac{5 \\rho^{2}}{54} - \\frac{25 \\pi^{2}}{162} + \\frac{164}{243}\\end{aligned}\n\\]\n### Coefficient of $\\epsilon^{0}$\n\n\\[\n\\begin{aligned}& \\frac{7 L^{4}}{108} + \\frac{20 L^{3}}{81} - \\frac{L^{2} M_{0,1}}{18} - \\frac{L^{2} \\rho^{2}}{8} - \\frac{7 \\pi^{2} L^{2}}{36} + \\frac{56 L^{2}}{81}\\\\ & {} + \\frac{7 L M_{1,1}}{18} - \\frac{5 L \\rho^{2}}{27} - \\frac{25 \\pi^{2} L}{81} + \\frac{2 L \\zeta\\left(3\\right)}{27} + \\frac{328 L}{243} + \\frac{M_{0,1}^{2}}{216}\\\\ & {} - \\frac{\\pi^{2} M_{0,1}}{108} + \\frac{10 M_{1,1}}{27} + \\frac{7 M_{2,1}}{72} - \\frac{\\rho^{4}}{192} - \\frac{13 \\pi^{2} \\rho^{2}}{432} - \\frac{14 \\rho^{2}}{81}\\\\ & {} - \\frac{70 \\pi^{2}}{243} - \\frac{35 \\pi^{4}}{1296} + \\frac{10 \\zeta\\left(3\\right)}{81} + \\frac{976}{729}\\end{aligned}\n\\]\n## Post-counterterm exponent\n\n### Coefficient of $\\epsilon^{-6}$\n\n\\[\n0\n\\]\n### Coefficient of $\\epsilon^{-5}$\n\n\\[\n0\n\\]\n### Coefficient of $\\epsilon^{-4}$\n\n\\[\n- \\frac{11}{81}\n\\]\n### Coefficient of $\\epsilon^{-3}$\n\n\\[\n\\frac{25}{243} - \\frac{2 L}{27}\n\\]\n### Coefficient of $\\epsilon^{-2}$\n\n\\[\n\\frac{10 L}{81} - \\frac{2 M_{0,1}}{9} - \\frac{\\rho^{2}}{9} - \\frac{19 \\pi^{2}}{162} + \\frac{10}{81}\n\\]\n### Coefficient of $\\epsilon^{-1}$\n\n\\[\n\\begin{aligned}& - \\frac{4 L M_{0,1}}{9} - \\frac{2 L \\rho^{2}}{9} - \\frac{2 \\pi^{2} L}{9} + \\frac{2 L}{81} - \\frac{10 M_{0,1}}{27} - \\frac{5 \\rho^{2}}{27} - \\frac{85 \\pi^{2}}{486}\\\\ & {} - \\frac{14 \\zeta\\left(3\\right)}{81} + \\frac{260}{2187}\\end{aligned}\n\\]\n### Coefficient of $\\epsilon^{0}$\n\n\\[\n\\begin{aligned}& - \\frac{L^{4}}{54} - \\frac{10 L^{3}}{81} - \\frac{5 L^{2} M_{0,1}}{9} - \\frac{L^{2} \\rho^{2}}{4} - \\frac{2 \\pi^{2} L^{2}}{9} - \\frac{25 L^{2}}{81} - \\frac{10 L M_{0,1}}{9}\\\\ & {} - \\frac{L M_{1,1}}{9} - \\frac{25 L \\rho^{2}}{54} - \\frac{10 \\pi^{2} L}{27} - \\frac{4 L \\zeta\\left(3\\right)}{9} - \\frac{232 L}{729} + \\frac{5 M_{0,1}^{2}}{108} - M_{0,1}\\\\ & {} - \\frac{\\pi^{2} M_{0,1}}{27} - \\frac{5 M_{1,1}}{27} - \\frac{M_{2,1}}{36} - \\frac{\\rho^{4}}{96} - \\frac{137 \\rho^{2}}{324} - \\frac{\\pi^{2} \\rho^{2}}{27}\\\\ & {} - \\frac{167 \\pi^{2}}{486} - \\frac{37 \\pi^{4}}{1215} - \\frac{110 \\zeta\\left(3\\right)}{243} + \\frac{32}{6561}\\end{aligned}\n\\]\n## Contour subtraction: coefficient of log Z4\n\n### Coefficient of $\\epsilon^{-6}$\n\n\\[\n0\n\\]\n### Coefficient of $\\epsilon^{-5}$\n\n\\[\n0\n\\]\n### Coefficient of $\\epsilon^{-4}$\n\n\\[\n- \\frac{11}{81}\n\\]\n### Coefficient of $\\epsilon^{-3}$\n\n\\[\n\\frac{25}{243} - \\frac{2 L}{27}\n\\]\n### Coefficient of $\\epsilon^{-2}$\n\n\\[\n\\frac{10 L}{81} - \\frac{2 M_{0,1}}{9} - \\frac{\\rho^{2}}{9} - \\frac{19 \\pi^{2}}{162} + \\frac{10}{81}\n\\]\n### Coefficient of $\\epsilon^{-1}$\n\n\\[\n\\begin{aligned}& - \\frac{4 L M_{0,1}}{9} - \\frac{2 L \\rho^{2}}{9} - \\frac{2 \\pi^{2} L}{9} + \\frac{2 L}{81} - \\frac{10 M_{0,1}}{27} - \\frac{5 \\rho^{2}}{27} - \\frac{85 \\pi^{2}}{486}\\\\ & {} - \\frac{14 \\zeta\\left(3\\right)}{81} + \\frac{260}{2187}\\end{aligned}\n\\]\n### Coefficient of $\\epsilon^{0}$\n\n\\[\n0\n\\]\n## Check equation\n\n\\[\\partial_LF_{3,c}-[2b_0F_2+b_1F_1]_c+2k_{3,c}L+h_{3,c}=0.\\]\n\nThe required lower-order polynomial $[2b_0F_2+b_1F_1]_c$ is:\n\n\\[\n\\begin{aligned}& - \\frac{2 L^{3}}{27} - \\frac{10 L^{2}}{27} + \\frac{L \\rho^{2}}{18} - \\frac{56 L}{81} + \\frac{\\pi^{2} L}{9} - \\frac{M_{1,1}}{9} + \\frac{5 \\rho^{2}}{54} - \\frac{164}{243}\\\\ & {} + \\frac{2 \\zeta\\left(3\\right)}{27} + \\frac{25 \\pi^{2}}{162}\\end{aligned}\n\\]\n## Provenance and interpretation\n\ndirect current raw moment-series assembly.\n\n[Machine-readable exact coefficients](coefficients.json), [conversion dictionary](conversion-dictionary.json), [diagram catalogue](diagrams.html), and [validation scope](validation-scope.html).\n";
