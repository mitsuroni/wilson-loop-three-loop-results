}}{216} - \\frac{M_{1,3}}{36} + \\frac{11 M_{2,1}}{72} - \\frac{N_{1,2}}{24} - \\frac{56071 \\pi^{2}}{69984}\\\\ & {} - \\frac{76 \\zeta\\left(3\\right)}{81} + \\frac{7 \\pi^{2} \\zeta\\left(3\\right)}{108} + 2 \\zeta\\left(5\\right) + \\frac{2239 \\pi^{4}}{77760} + \\frac{412765}{104976}\\end{aligned}\n\\]\n\nIts scale-independent shape $f_{3,Af}(\\rho)=F_{3,Af}(0,\\rho)$ is:\n\n\\[\n\\begin{aligned}& - \\frac{11 M_{0,1}^{2}}{432} - \\frac{M_{0,1} \\zeta\\left(3\\right)}{2} - \\frac{\\pi^{2} M_{0,1}}{48} + \\frac{2051 M_{0,1}}{1296} + \\frac{289 M_{1,1}}{216}\\\\ & {} - \\frac{M_{1,3}}{36} + \\frac{11 M_{2,1}}{72} - \\frac{N_{1,2}}{24} - \\frac{56071 \\pi^{2}}{69984} - \\frac{76 \\zeta\\left(3\\right)}{81}\\\\ & {} + \\frac{7 \\pi^{2} \\zeta\\left(3\\right)}{108} + 2 \\zeta\\left(5\\right) + \\frac{2239 \\pi^{4}}{77760} + \\frac{412765}{104976}\\end{aligned}\n\\]\n\nThe cusp coefficient $k_{3,Af}$ and non-cusp coefficient $h_{3,Af}$ are, respectively:\n\n\\[\n- \\frac{7 \\zeta\\left(3\\right)}{6} - \\frac{209}{216} + \\frac{5 \\pi^{2}}{54}\n\\]\n\n\\[\n- \\frac{\\pi^{4}}{30} - \\frac{5921}{5832} + \\frac{91 \\zeta\\left(3\\right)}{54} + \\frac{707 \\pi^{2}}{1944}\n\\]\n\nThe contour anomalous dimension convention is $\\gamma_{4,3,c}=2h_{3,c}$.\n\n## Scale-stripped bare color sum U\n\n### Coefficient of $\\epsilon^{-6}$\n\n\\[\n0\n\\]\n### Coefficient of $\\epsilon^{-5}$\n\n\\[\n0\n\\]\n### Coefficient of $\\epsilon^{-4}$\n\n\\[\n\\frac{11}{162}\n\\]\n### Coefficient of $\\epsilon^{-3}$\n\n\\[\n\\frac{533}{1944} - \\frac{\\pi^{2}}{162}\n\\]\n### Coefficient of $\\epsilon^{-2}$\n\n\\[\n- \\frac{11 M_{0,1}}{36} - \\frac{11 \\rho^{2}}{36} - \\frac{581 \\pi^{2}}{1944} - \\frac{7 \\zeta\\left(3\\right)}{27} + \\frac{1633}{1944}\n\\]\n### Coefficient of $\\epsilon^{-1}$\n\n\\[\n\\begin{aligned}& \\frac{5 M_{0,1}}{48} + \\frac{11 M_{1,1}}{24} - \\frac{61 \\rho^{2}}{108} + \\frac{\\pi^{2} \\rho^{2}}{72} - \\frac{11989 \\pi^{2}}{23328} - \\frac{91 \\zeta\\left(3\\right)}{324 frac{121 \\pi^{2} L}{108} - \\frac{5 M_{0,1}}{24} - \\frac{11 M_{1,1}}{12} - \\frac{\\pi^{2} \\rho^{2}}{72} + \\frac{443 \\rho^{2}}{864}\\\\ & {} - \\frac{1058}{243} - \\frac{\\pi^{4}}{72} + \\frac{1175 \\pi^{2}}{1296}\\end{aligned}\n\\]\n### Coefficient of $\\epsilon^{0}$\n\n\\[\n\\begin{aligned}& - \\frac{77 L^{4}}{216} - \\frac{1021 L^{3}}{648} + \\frac{\\pi^{2} L^{3}}{27} + \\frac{11 L^{2} M_{0,1}}{36} + \\frac{11 L^{2} \\rho^{2}}{16} - \\frac{356 L^{2}}{81}\\\\ & {} + \\frac{7 L^{2} \\zeta\\left(3\\right)}{3} + \\frac{77 \\pi^{2} L^{2}}{72} - \\frac{5 L M_{0,1}}{24} - \\frac{77 L M_{1,1}}{36} - \\frac{\\pi^{2} L \\rho^{2}}{36}\\\\ & {} + \\frac{931 L \\rho^{2}}{864} - \\frac{2116 L}{243} - \\frac{\\pi^{4} L}{36} - \\frac{11 L \\zeta\\left(3\\right)}{27} + \\frac{2395 \\pi^{2} L}{1296} - \\frac{11 M_{0,1}^{2}}{432}\\\\ & {} + \\frac{11 \\pi^{2} M_{0,1}}{216} - \\frac{1021 M_{1,1}}{432} + \\frac{M_{1,3}}{18} - \\frac{77 M_{2,1}}{144} + \\frac{N_{1,2}}{12} + \\frac{11 \\rho^{4}}{384}\\\\ & {} - \\frac{13 \\rho^{2} \\zeta\\left(3\\right)}{12} + \\frac{89 \\rho^{2}}{81} + \\frac{143 \\pi^{2} \\rho^{2}}{864} - \\frac{163 \\pi^{2} \\zeta\\left(3\\right)}{108} - \\frac{6328}{729}\\\\ & {} - \\frac{289 \\zeta\\left(3\\right)}{324} + \\frac{23 \\zeta\\left(5\\right)}{6} + \\frac{385 \\pi^{4}}{2592} + \\frac{445 \\pi^{2}}{243}\\end{aligned}\n\\]\n## Post-counterterm exponent\n\n### Coefficient of $\\epsilon^{-6}$\n\n\\[\n0\n\\]\n### Coefficient of $\\epsilon^{-5}$\n\n\\[\n0\n\\]\n### Coefficient of $\\epsilon^{-4}$\n\n\\[\n\\frac{121}{162}\n\\]\n### Coefficient of $\\epsilon^{-3}$\n\n\\[\n\\frac{11 L}{27} - \\frac{485}{486} + \\frac{5 \\pi^{2}}{324}\n\\]\n### Coefficient of $\\epsilon^{-2}$\n\n\\[\n- \\frac{167 L}{162} + \\frac{\\pi^{2} L}{54} - \\frac{503}{972} + \\frac{13 \\pi^{2}}{972} + \\frac{35 \\zeta\\left(3\\right)}{54}\n\\]\n### Coefficient of $\\epsilon^{-1}$\n\n\\[\n\\begin{aligned}& - \\frac{5 \\pi^{2} L}{81} + \\frac{209 L}{324} + \\frac{7 L \\zeta\\left(3\\right)}{9} - \\frac{707 \\pi^{2}}{5832} - \\frac{91 \\zeta\\left(3\\right)}{162} + \\frac{5921}{17496}\\\\ & {} + \\frac{\\pi^{4}}{90}\\end{aligned}\n\\]\n### Coefficient of $\\epsilon^{0}$\n\n\\[\n\\begin{aligned}& \\frac{11 L^{4}}{108} - \\frac{\\pi^{2} L^{3}}{54} + \\frac{289 L^{3}}{324} - \\frac{11 L^{2} \\rho^{2}}{72} - \\frac{43 \\pi^{2} L^{2}}{108} + \\frac{2051 L^{2}}{648}\\\\ & {} + \\frac{11 L M_{1,1}}{18} - \\frac{289 L \\rho^{2}}{432} + \\frac{\\pi^{2} L \\rho^{2}}{72} - \\frac{2807 \\pi^{2} L}{1944} - \\frac{113 L \\zeta\\left(3\\right)}{54}\\\\ & {} + \\frac{17 \\pi^{4} L}{360} + \\frac{31313 L}{5832} - \\frac{11 M_{0,1}^{2}}{432} - \\frac{M_{0,1} \\zeta\\left(3\\right)}{2} - \\frac{\\pi^{2} M_{0,1}}{48}\\\\ & {} + \\frac{2051 M_{0,1}}{1296} + \\frac{289 M_{1,1}}{216} - \\frac{M_{1,3}}{36} + \\frac{11 M_{2,1}}{72} - \\frac{N_{1,2}}{24} - \\frac{56071 \\pi^{2}}{69984}\\\\ & {} - \\frac{76 \\zeta\\left(3\\right)}{81} + \\frac{7 \\pi^{2} \\zeta\\left(3\\right)}{108} + 2 \\zeta\\left(5\\right) + \\frac{2239 \\pi^{4}}{77760} + \\frac{412765}{104976}\\end{aligned}\n\\]\n## Contour subtraction: coefficient of log Z4\n\n### Coefficient of $\\epsilon^{-6}$\n\n\\[\n0\n\\]\n### Coefficient of $\\epsilon^{-5}$\n\n\\[\n0\n\\]\n### Coefficient of $\\epsilon^{-4}$\n\n\\[\n\\frac{121}{162}\n\\]\n### Coefficient of $\\epsilon^{-3}$\n\n\\[\n\\frac{11 L}{27} - \\frac{485}{486} + \\frac{5 \\pi^{2}}{324}\n\\]\n### Coefficient of $\\epsilon^{-2}$\n\n\\[\n- \\frac{167 L}{162} + \\frac{\\pi^{2} L}{54} - \\frac{503}{972} + \\frac{13 \\pi^{2}}{972} + \\frac{35 \\zeta\\left(3\\right)}{54}\n\\]\n### Coefficient of $\\epsilon^{-1}$\n\n\\[\n\\begin{aligned}& - \\frac{5 \\pi^{2} L}{81} + \\frac{209 L}{324} + \\frac{7 L \\zeta\\left(3\\right)}{9} - \\frac{707 \\pi^{2}}{5832} - \\frac{91 \\zeta\\left(3\\right)}{162} + \\frac{5921}{17496}\\\\ & {} + \\frac{\\pi^{4}}{90}\\end{aligned}\n\\]\n### Coefficient of $\\epsilon^{0}$\n\n\\[\n0\n\\]\n## Check equation\n\n\\[\\partial_LF_{3,c}-[2b_0F_2+b_1F_1]_c+2k_{3,c}L+h_{3,c}=0.\\]\n\nThe required lower-order polynomial $[2b_0F_2+b_1F_1]_c$ is:\n\n\\[\n\\begin{aligned}& \\frac{11 L^{3}}{27} - \\frac{\\pi^{2} L^{2}}{18} + \\frac{289 L^{2}}{108} - \\frac{11 L \\rho^{2}}{36} - \\frac{11 \\pi^{2} L}{18} - \\frac{7 L \\zeta\\left(3\\right)}{3}\\\\ & {} + \\frac{356 L}{81} + \\frac{11 M_{1,1}}{18} - \\frac{289 \\rho^{2}}{432} + \\frac{\\pi^{2} \\rho^{2}}{72} - \\frac{175 \\pi^{2}}{162} - \\frac{11 \\zeta\\left(3\\right)}{27}\\\\ & {} + \\frac{\\pi^{4}}{72} + \\frac{1058}{243}\\end{aligned}\n\\]\n## Provenance and interpretation\n\nreconstruct compact post from selected poles and finite_MN; subtract independently rebuilt CT; divide S3 by exact coefficient recursion; verify every coefficient against original selected GPL.\n\nThe compact bare expression is obtained from the selected compact post-counterterm result minus independently rebuilt counterterms, followed by exact division by S3. Every coefficient is then freshly back-substituted to Hlog and compared with the existing evaluated bare sum. This representation construction does not constitute a new independent diagram summation. The original mixed-argument HyperInt sum witness is retained.\n\n[Machine-readable exact coefficients](coefficients.json), [conversion dictionary](conversion-dictionary.json), [diagram catalogue](diagrams.html), and [validation scope](validation-scope.html).\n";
